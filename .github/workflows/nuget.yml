name: NuGet

# The engine's packages on nuget.org: bogzxo.Horizon.HIDL, bogzxo.Horizon.Engine, the platforms
# bogzxo.Horizon.Platform.Desktop, .Android and .iOS, bogzxo.Horizon.UI, bogzxo.Horizon.Terminal, bogzxo.Horizon.Tooling
# and the tool bogzxo.Horizon.Shaders.Build, see scripts/pack.ps1. On a Mac, as the iOS platform builds nowhere else
# a runner has. A tag
# named for the version (v1.5.0) packs and publishes them. Run by hand it only packs, and the packages are the run's
# artifact, unless publish is ticked.
#
# Publishing is nuget.org's trusted publishing: no API key is kept here. The job asks GitHub for a token saying which
# repository and workflow it is, nuget.org checks that against the policy made at
# https://www.nuget.org/account/trustedpublishing and hands back a key good for an hour. docs/nuget-publishing.md has
# what the policy has to say. The one secret is NUGET_USER, the nuget.org username.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to nuget.org as well
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: macos-latest
    permissions:
      # Making the release
      contents: write
      # Lets the job ask GitHub for the token nuget.org trusts
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # HIDL is a submodule (bogzxo/hidl at Horizon.HIDL)
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # The phone platforms' workloads
      - name: Workloads
        run: dotnet workload install android ios

      # A tag that says one version over packages that say another would publish the wrong thing under the right name
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ($env:GITHUB_REF_NAME.Substring(1) -ne $version) { throw "The tag $env:GITHUB_REF_NAME must match Directory.Build.props ($version)." }

      - name: Pack
        shell: pwsh
        run: ./scripts/pack.ps1 -Output artifacts/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      # The key lasts an hour and the token gets one key, so it's asked for last, just before it's used
      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # A version nuget.org already has fails the run (409 Conflict) rather than being passed over unseen
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      # The version's release on GitHub, with the packages on it and nothing else
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/nuget/*.nupkg --repo "$GITHUB_REPOSITORY" --title "Horizon $GITHUB_REF_NAME" --generate-notes
