# Every push to master, the engine's programs (the AutoVoxel example and the Horizon.Testing scenes) published for
# Windows, Linux and macOS, self-contained so .NET needn't be on the machine, a zip for each kept with the run
# (Actions, the run, Artifacts). A version tag (v1.5.0) is the NuGet workflow's and builds none of this: a release
# of the engine is its packages, and nothing else goes on it.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [ AutoVoxel, Horizon.Testing ]
        platform:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HIDL is a submodule (bogzxo/hidl at Horizon.HIDL)
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish
        run: dotnet publish ${{ matrix.app }}/${{ matrix.app }}.csproj --configuration Release --runtime ${{ matrix.platform.rid }} --self-contained true --output publish/${{ matrix.app }}

      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.app }} -DestinationPath ${{ matrix.app }}-${{ matrix.platform.rid }}.zip

      - name: Zip
        if: runner.os != 'Windows'
        working-directory: publish
        run: zip -r ../${{ matrix.app }}-${{ matrix.platform.rid }}.zip ${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform.rid }}
          path: ${{ matrix.app }}-${{ matrix.platform.rid }}.zip
