# Every push to master, the engine's programs (the AutoVoxel example and the Horizon.Testing scenes) published for
# Windows, Linux and macOS, self-contained so .NET needn't be on the machine, a zip for each kept with the run
# (Actions, the run, Artifacts). Pushing a tag that starts with v (v0.4.0) builds the same and puts the zips on a
# GitHub release of that name.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [ AutoVoxel, Horizon.Testing ]
        platform:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HIDL is a submodule (bogzxo/hidl at Horizon.HIDL)
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish
        run: dotnet publish ${{ matrix.app }}/${{ matrix.app }}.csproj --configuration Release --runtime ${{ matrix.platform.rid }} --self-contained true --output publish/${{ matrix.app }}

      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.app }} -DestinationPath ${{ matrix.app }}-${{ matrix.platform.rid }}.zip

      - name: Zip
        if: runner.os != 'Windows'
        working-directory: publish
        run: zip -r ../${{ matrix.app }}-${{ matrix.platform.rid }}.zip ${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform.rid }}
          path: ${{ matrix.app }}-${{ matrix.platform.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Horizon $GITHUB_REF_NAME" --generate-notes
