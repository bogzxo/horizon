# Every push and pull request, the engine built and its tests run on Windows, Linux and macOS, Debug as well as
# Release, since the Skyline debugger and its tests are only in a Debug build. Nothing here needs a GPU.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "development", "platform" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:
  android-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install Android workload
        run: dotnet workload install android
      - name: Report Android toolchain
        run: dotnet workload list
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android SDK dependencies
        run: dotnet build Horizon.Android.Probe/Horizon.Android.Probe.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: Build Android loader probe
        run: dotnet build Horizon.Android.Probe/Horizon.Android.Probe.csproj -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        configuration: [ Debug, Release ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HIDL is a submodule (bogzxo/hidl at Horizon.HIDL)
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Horizon.sln --configuration ${{ matrix.configuration }}

      # A test that hangs is stopped after three minutes and named, rather than holding the runner for six hours
      - name: Test
        run: dotnet test Horizon.Tests --no-build --configuration ${{ matrix.configuration }} --verbosity normal --blame-hang-timeout 3m --blame-hang-dump-type none
